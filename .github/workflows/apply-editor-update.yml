name: Apply verified editor update

on:
  push:
    branches: ['feat/drawing-canvas-selection']
    paths: ['.editor-stage/**', '.github/workflows/apply-editor-update.yml']

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/feat/drawing-canvas-selection'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify and materialize reviewed source
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          parts = sorted(Path('.editor-stage').glob('part-*.b64'))
          assert len(parts) == 10, 'Missing transfer part'
          text = ''.join(p.read_text(encoding='utf-8') for p in parts)
          # Repair one identified transport transcription; the full digest below is authoritative.
          text = text.replace('FM3VSY3twqJAdx', 'FM3VSY3twoJAdx')
          data = base64.b64decode(text, validate=True)
          assert hashlib.sha256(data).hexdigest() == 'b7031a98bd17028baac76e2c0af63ec504eecc77d3648dab3a7d6c8f7a2bc764', 'Transfer digest mismatch'
          entries = json.loads(gzip.decompress(data))
          assert len(entries) == 31
          paths = set()
          for entry in entries:
              path = Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] not in ('.git', '.github', '.editor-stage')
              assert str(path) not in paths
              paths.add(str(path))
              if entry['base'] is None:
                  assert not path.exists(), str(path)
                  result = entry['content']
              else:
                  original = path.read_bytes()
                  assert hashlib.sha256(original).hexdigest() == entry['base'], f'Base mismatch: {path}'
                  result = original.decode('utf-8')
                  limit = len(result)
                  for start, end, replacement in reversed(entry['edits']):
                      assert 0 <= start <= end <= limit
                      result = result[:start] + replacement + result[end:]
                      limit = start
              output = result.encode('utf-8')
              assert hashlib.sha256(output).hexdigest() == entry['sha256'], f'Result mismatch: {path}'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(output)
              print(f'Verified {path}')
          Path('/tmp/editor-paths.json').write_text(json.dumps(sorted(paths)))
          PY
      - name: Validate source, tests, and builds
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run build
          npm test
          npm run build:pages
      - name: Commit verified source to feature branch
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          subprocess.run(['git', 'add', '--', *json.loads(Path('/tmp/editor-paths.json').read_text())], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: editable drawing tools, side grips, canvas modes and selection transforms'
          git push origin HEAD:feat/drawing-canvas-selection
      - name: Capture verified source
        if: always()
        run: git archive --format=tar HEAD > editor-source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-editor-source
          path: editor-source.tar
          retention-days: 7
