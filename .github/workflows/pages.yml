name: Test and publish GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build standalone test fixture
        run: npm run build
      - name: Run core, server, and deployment tests
        run: npm test
      - name: Build modular and standalone editions
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published source revision
        env:
          SITE_URL: https://wieslawsoltes.github.io/NexoraDiagram/
        run: |
          node --input-type=module <<'JS'
          import { appendFile } from 'node:fs/promises';
          import { setTimeout } from 'node:timers/promises';
          const { SITE_URL: site, GITHUB_SHA: revision, GITHUB_STEP_SUMMARY: summary } = process.env;
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const response = await fetch(`${site}build-info.json?revision=${revision}&attempt=${attempt}`, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
              if (response.ok && (await response.json()).sourceRevision === revision) {
                for (const path of ['', 'src/main.js', 'src/core/router.worker.js', 'Nexora-Diagram.html', 'tests/webgpu-smoke.html']) {
                  const asset = await fetch(new URL(path, site), { signal: AbortSignal.timeout(15000) });
                  if (!asset.ok) throw new Error(`${path}: HTTP ${asset.status}`);
                  await asset.arrayBuffer();
                }
                await appendFile(summary, `## Nexora Diagram published\n\n[Open the app](${site})\n\nVerified source revision: \`${revision}\`.\n`);
                console.log(`Published and verified ${site} at ${revision}`);
                process.exit(0);
              }
            } catch (error) { console.log(`Publication check ${attempt + 1}: ${error.message}`); }
            await setTimeout(5000);
          }
          throw new Error('GitHub Pages did not serve the expected source revision within the verification window.');
          JS
