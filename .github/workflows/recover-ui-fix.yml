name: Commit verified dialog focus fix
on:
  push:
    branches: ['feat/advanced-authoring-collaboration']
    paths: ['.github/workflows/recover-ui-fix.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply exact locally verified source change
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const path = 'src/ui/panels.js';
          const hash = s => createHash('sha256').update(s).digest('hex');
          const before = readFileSync(path, 'utf8');
          if (hash(before) !== '0a1c90c14b9bc94c0357cbc81321375f59efeb01bd135404d6af815d607f45b2') throw Error('Unexpected source revision');
          const after = before.replace("$('dialog').showModal(); setTimeout(() => $('dialog-body').querySelector('input,textarea,select')?.focus(), 20);", "$('dialog').showModal(); $('dialog-body').querySelector('input,textarea,select')?.focus();");
          if (hash(after) !== '2046b453cb0e6cee9b4d8f3e044011cb771e95afb94249c615c205f2c50c1c25') throw Error('Source digest mismatch');
          writeFileSync(path, after);
          JS
          npm run build
          npm test
          npm run build:pages
      - name: Commit source fix on authorized branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/advanced-authoring-collaboration'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/panels.js
          git commit -m 'fix: prevent delayed dialog autofocus from redirecting field input'
          git -c credential.helper='!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/feat/advanced-authoring-collaboration
